{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="login-card">

    {% if error %}
        <div class="alert alert-danger text-center">
            {{ error }}
        </div>
    {% endif %}

    <main class="card-body">
        <h2 class="card-title text-center mb-4">Log In to Your Account</h2>
        <form method="POST">
            {% csrf_token %}

            <div class="mb-3">
                <label class="form-label">Username</label>
                <input 
                    type="text" 
                    name="username" 
                    class="form-control" 
                    placeholder="Enter your username"
                    required>
            </div>

            <div class="mb-3">
                <label class="form-label">Password</label>
                <input 
                    type="password" 
                    name="password" 
                    class="form-control" 
                    placeholder="Enter your password"
                    required>
            </div>

            <button type="submit" class="btn-primary">Log In</button>
        </form>
    </main>

        <div class="extra-links">
            <p>
                <button class=".btn-primary">
                    <a href="{% url 'forgot_password' %}" class="btn btn-primary">Forgot Password?</a>
                </button>
            </p>
            <p>Don't have an account? <button class=".btn-primary"><a href="{% url 'register_user' %}">Sign up</a></button></p>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
{% endblock %}
