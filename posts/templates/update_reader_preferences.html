{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2>Update Your Article Preferences</h2>
    <p class="text-muted">Choose the types of articles you want to see in your feed.</p>

    <form method="POST">
        {% csrf_token %}

        {% for category in categories %}
            <div class="form-check">
                <input 
                    class="form-check-input" 
                    type="checkbox" 
                    name="categories" 
                    value="{{ category.id }}"
                    {% if category in selected_categories %}checked{% endif %}
                >
                <label class="form-check-label">
                    {{ category.name }}
                </label>
            </div>
        {% endfor %}

        <button type="submit" class="btn btn-primary mt-3">
            Save Preferences
        </button>
    </form>

</div>
{% endblock %}
