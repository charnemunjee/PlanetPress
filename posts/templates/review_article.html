{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2>Review Article</h2>

    <h3>{{ article.title }}</h3>

    <p class="text-muted">
        By {{ article.author.username }} • {{ article.created_at|date:"F j, Y" }}
    </p>

    <hr>

    <div class="mb-4">
        <p>{{ article.content|linebreaks }}</p>
    </div>

    <hr>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Feedback for the Journalist (optional)</label>
            <textarea name="feedback" class="form-control" rows="4"></textarea>
        </div>

        <button name="decision" value="approve" class="btn btn-success">
            Approve Article
        </button>

        <button name="decision" value="unapprove" class="btn btn-warning ms-2">
            Mark as Unapproved
        </button>
    </form>

    <button onclick="history.back()">Go Back</button>

</div>
{% endblock %}
