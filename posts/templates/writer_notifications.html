{% extends "base.html" %}

{% block content %}
<h1>Your Notifications</h1>

{% if notifications %}
    <ul class="list-group mt-4">
        {% for note in notifications %}
            <li class="list-group-item">
                <p>{{ note.message }}</p>
                <small class="text-muted">{{ note.created_at|date:"F j, Y, g:i a" }}</small>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>No notifications yet.</p>
{% endif %}
{% endblock %}
