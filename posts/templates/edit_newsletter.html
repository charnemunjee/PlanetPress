{% extends "base.html" %}

{% block content %}
<div class="container mt-4">

    <h2>Edit Newsletter</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ newsletter.title }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">Description</label>
            <textarea name="description" class="form-control" rows="4">{{ newsletter.description }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Select Articles</label>
            <select name="articles" class="form-select" multiple size="8">
                {% for article in articles %}
                    <option value="{{ article.id }}"
                        {% if article in newsletter.articles.all %}selected{% endif %}>
                        {{ article.title }}
                    </option>
                {% endfor %}
            </select>
        </div>

        <button class="btn btn-primary">Save Changes</button>
    </form>

</div>
{% endblock %}
